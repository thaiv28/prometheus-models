name: Valorant Site feed

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: valorant-feed
  cancel-in-progress: false

jobs:
  feed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: games/valorant
    timeout-minutes: 15
    env:
      BUCKET: ${{ vars.DATA_BACKUP_BUCKET }}
      HAS_DISPATCH: ${{ secrets.PROMETHEUS_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-game
        with:
          game: valorant
          role: ${{ secrets.AWS_ROLE_ARN }}
      - name: Download ratings snapshot
        run: |
          mkdir -p data/feed
          if ! aws s3 cp "s3://$BUCKET/valorant-model/feed/state.pkl.gz" data/feed/state.pkl.gz --only-show-errors; then
            echo "::error::Cannot download ratings snapshot; run refresh-db first"
            exit 1
          fi
      - name: Restore prediction log
        env:
          DATA_BACKUP_BUCKET: ${{ env.BUCKET }}
        run: bash scripts/feed_data.sh restore
      - name: Restore schedule cache
        run: aws s3 sync "s3://$BUCKET/valorant-model/feed/upcoming" data/upcoming --only-show-errors
      - name: Export feed
        run: |
          uv run promval export --state data/feed/state.pkl.gz --out data/feed/valorant.json | tee "$RUNNER_TEMP/export.log"
          tail -n 1 "$RUNNER_TEMP/export.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload feed
        id: upload
        run: |
          content_hash=$(python3 -c 'import json,sys,hashlib; d=json.load(open(sys.argv[1])); d.pop("generated",None); print(hashlib.sha256(json.dumps(d,sort_keys=True).encode()).hexdigest())' data/feed/valorant.json)
          previous_content=$(aws s3api head-object --bucket "$BUCKET" --key valorant-model/feed/valorant.json.gz --query 'Metadata."content-sha256"' --output text 2>/dev/null || true)
          if [ "$content_hash" != "$previous_content" ]; then
            echo "feed_changed=true" >> "$GITHUB_OUTPUT"
          fi
          gzip -9 -c data/feed/valorant.json > data/feed/valorant.json.gz
          aws s3 cp data/feed/valorant.json.gz "s3://$BUCKET/valorant-model/feed/valorant.json.gz" --metadata content-sha256="$content_hash" --content-type application/json --only-show-errors
      - name: Upload execution candidates
        run: aws s3 cp data/feed/candidates.json "s3://$BUCKET/valorant-model/feed/candidates.json" --content-type application/json --only-show-errors
      - name: Save prediction log
        env:
          DATA_BACKUP_BUCKET: ${{ env.BUCKET }}
        run: bash scripts/feed_data.sh save
      - name: Save schedule cache
        run: aws s3 sync data/upcoming "s3://$BUCKET/valorant-model/feed/upcoming" --only-show-errors
      - name: Dispatch Prometheus
        if: env.HAS_DISPATCH == 'true' && steps.upload.outputs.feed_changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROMETHEUS_DISPATCH_TOKEN }}
        run: gh workflow run games.yml -R thaiv28/Prometheus --ref main
