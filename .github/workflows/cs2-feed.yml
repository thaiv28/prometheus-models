name: CS2 Site feed

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: cs2-feed
  cancel-in-progress: false

defaults:
  run:
    working-directory: games/cs2

jobs:
  feed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUCKET: ${{ vars.DATA_BACKUP_BUCKET }}
      HAS_DISPATCH: ${{ secrets.PROMETHEUS_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-game
        with:
          game: cs2
          role: ${{ secrets.AWS_ROLE_ARN }}
      - name: Download ratings snapshot
        run: |
          mkdir -p data/feed
          if ! aws s3 cp "s3://$BUCKET/cs2-model/feed/state.pkl.gz" data/feed/state.pkl.gz --only-show-errors; then
            echo "::error::Unable to load ratings snapshot; run refresh-db first"
            exit 1
          fi
      - run: bash scripts/feed_data.sh restore
      - run: aws s3 sync "s3://$BUCKET/cs2-model/feed/upcoming" data/upcoming --only-show-errors
      - name: Export feed
        shell: bash  # pipefail: a failed export must fail this step, not the upload
        run: |
          uv run promcs export --state data/feed/state.pkl.gz --out data/feed/cs2.json | tee /tmp/export-summary
          tail -1 /tmp/export-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload feed
        id: upload
        run: |
          content_hash=$(python3 -c 'import json,sys,hashlib; d=json.load(open(sys.argv[1])); d.pop("generated",None); print(hashlib.sha256(json.dumps(d,sort_keys=True).encode()).hexdigest())' data/feed/cs2.json)
          previous_content=$(aws s3api head-object --bucket "$BUCKET" --key cs2-model/feed/cs2.json.gz --query 'Metadata."content-sha256"' --output text 2>/dev/null || true)
          if [ "$content_hash" != "$previous_content" ]; then
            echo "feed_changed=true" >> "$GITHUB_OUTPUT"
          fi
          gzip -9 -c data/feed/cs2.json > data/feed/cs2.json.gz
          aws s3 cp data/feed/cs2.json.gz "s3://$BUCKET/cs2-model/feed/cs2.json.gz" --metadata content-sha256="$content_hash" --content-type application/json --only-show-errors
          aws s3 cp data/feed/candidates.json "s3://$BUCKET/cs2-model/feed/candidates.json" --content-type application/json --only-show-errors
      - run: bash scripts/feed_data.sh save
      - run: aws s3 sync data/upcoming "s3://$BUCKET/cs2-model/feed/upcoming" --only-show-errors
      - name: Dispatch Prometheus
        if: env.HAS_DISPATCH == 'true' && steps.upload.outputs.feed_changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROMETHEUS_DISPATCH_TOKEN }}
        run: gh workflow run games.yml -R thaiv28/Prometheus --ref main
